# Installs the formula with Homebrew and runs its test, on macOS and Linux.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install and test
        run: |
          brew tap gnista-editor/tap "$GITHUB_WORKSPACE"
          brew install gnista-editor/tap/gnista
          brew test gnista-editor/tap/gnista
          gnista --batch --eval 'gnista.message("gnista " + gnista.variable("gnista-version"))'
