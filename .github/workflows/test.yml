# Installs the formula with Homebrew and runs its test, on macOS and Linux.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install and test
        run: |
          brew tap e8-editor/tap "$GITHUB_WORKSPACE"
          brew install e8-editor/tap/e8
          brew test e8-editor/tap/e8
          e8 --batch --eval 'e8.message("e8 " + e8.variable("e8-version"))'

      # What decides whether macOS opens the app: its ad-hoc signature is
      # intact, and nothing marked it quarantined on the way.
      - name: Check E8.app
        if: runner.os == 'macOS'
        run: |
          app="$(brew --prefix)/opt/e8/E8.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          if xattr -r "$app" | grep -q com.apple.quarantine; then
            echo "::error::E8.app is quarantined"
            exit 1
          fi
          echo "E8.app is signed and not quarantined"
