# Each day, and by hand, rewrites Formula/e8.rb for E8's newest
# release and commits it if it changed, so the tap follows releases with no
# token in E8's own repository.
name: Update

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: A release tag, such as v0.2.1; the newest if empty
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Write the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./update-formula.sh ${{ inputs.tag }}

      - name: Commit it if it changed
        run: |
          if git diff --quiet; then
            echo "The formula is current."
            exit 0
          fi
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/e8.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "e8 $version"
          git push
